name: Build iPhone app

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Lanes at M27 J3 from the M271
        run: python3 .github/probe/lanes.py 50.8880 -1.4420 50.9620 -1.3640 || true
      - name: Slip roads
        working-directory: VelaCore
        run: swift run vela-probe ramps 2>&1 | grep -v "^\[" | grep -v "^Building\|^Compiling\|^Build of"
