name: Build iPhone app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Check search code
    # Kite's engine is shared Kotlin now (android/core), so its checks run on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon -PcoreOnly :core:jvmTest
      - name: Live camera photos check (OpenHighways, TfL, Windy)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          ua = {"User-Agent": "Kite-Maps (https://github.com/matteofx1/kite-maps)"}
          def get(url, h={}):
              r = urllib.request.urlopen(urllib.request.Request(url, headers={**ua, **h}), timeout=40)
              return r.status, r.headers, r.read()
          code, _, body = get("https://openhighways.uk/api/cameras")
          cams = json.loads(body)
          by = {}
          for c in cams: by[c.get("source")] = by.get(c.get("source"), 0) + 1
          print("OpenHighways", code, len(cams), by)
          print("  sample", json.dumps(cams[0])[:400])
          for src in by:
              c = next(c for c in cams if c.get("source") == src and c.get("image_url"))
              url = c["image_url"] if c["image_url"].startswith("http") else "https://openhighways.uk" + c["image_url"]
              try:
                  code, h, img = get(url)
                  print("  photo", src, code, h.get("Content-Type"), len(img), "Last-Modified:", h.get("Last-Modified"), url)
              except Exception as e:
                  print("  photo", src, "FAILED", e, url)
          code, _, body = get("https://api.tfl.gov.uk/Place/Type/JamCam")
          print("TfL", code, len(json.loads(body)))
          key = re.search(r'const val VALUE = "([^"]*)"', open("android/shared/src/commonMain/kotlin/app/kite/LiveCamStore.kt").read()).group(1)
          code, _, body = get("https://api.windy.com/webcams/api/v3/webcams?nearby=54.6,-3.13,60&limit=50&include=images,location,urls", {"x-windy-api-key": key})
          w = json.loads(body)
          print("Windy", code, w.get("total"), len(w.get("webcams", [])))
          print("  sample", json.dumps(w["webcams"][0])[:700])
          PY

      - name: Live roundabout check
        continue-on-error: true
        timeout-minutes: 4
        run: python3 .github/probe/roundabouts.py
      - name: Live roundabout lanes check
        continue-on-error: true
        timeout-minutes: 2
        run: python3 .github/probe/lanes.py
      - name: Live camera direction check (UK)
        continue-on-error: true
        timeout-minutes: 6
        run: python3 .github/probe/camdir.py
      - name: Live camera side-of-road check (UK)
        continue-on-error: true
        timeout-minutes: 6
        run: python3 .github/probe/camside.py
      - name: Live heat map tiles check (Highway Radar server, UK)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pip3 install --quiet --break-system-packages pillow || pip3 install --quiet pillow || true
          python3 .github/probe/heattiles.py
      - name: Live UK turn-by-turn check
        working-directory: android
        continue-on-error: true
        timeout-minutes: 6
        run: ./gradlew --no-daemon -q -PcoreOnly :core:probe --args="uk"
      - name: Live turn-by-turn audit (Southampton)
        working-directory: android
        continue-on-error: true
        timeout-minutes: 6
        run: ./gradlew --no-daemon -q -PcoreOnly :core:probe --args="audit"
      - name: Live Google and Waze check
        working-directory: android
        continue-on-error: true
        timeout-minutes: 4
        run: ./gradlew --no-daemon -q -PcoreOnly :core:probe --args="live"

  # The long checks: 80 tricky British junctions, every merge and every slip road, driven through
  # Kite's own turn-by-turn. Too slow for every change, so they run only when started by hand
  # (Actions > Build iPhone app > Run workflow).
  junctions:
    name: Junction check (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "first 40 junctions", cmd: "turns", set: "1" }
          - { name: "second 40 junctions", cmd: "turns", set: "2" }
          - { name: "merges", cmd: "merges", set: "1" }
          - { name: "slip roads", cmd: "ramps", set: "1" }
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run the check
        working-directory: android
        env:
          TURNSET: ${{ matrix.set }}
        run: ./gradlew --no-daemon -q -PcoreOnly :core:probe --args="${{ matrix.cmd }}"

  ipa:
    name: Build Kite.ipa
    # Xcode 27.1 (the iOS 27.1 SDK) is what lets Kite fill the iPhone Duo's screens; built with an
    # older Xcode it runs there small, with black bars.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Set up Java (for the shared app's build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build the shared app (the same code as Android)
        run: .github/ios/shared-app.sh release
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Kite.xcodeproj \
            -scheme Kite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200
      - name: Stamp the build number
        # AltStore and SideStore spot updates by this number, so each build gets its own.
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" \
            build/Build/Products/Release-iphoneos/Kite.app/Info.plist
          for p in build/Build/Products/Release-iphoneos/Kite.app/PlugIns/*.appex/Info.plist; do
            [ -e "$p" ] && /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$p"
          done
      - name: Ad-hoc sign
        # An app with no signature at all is read as broken by some sideloaders. An ad-hoc
        # signature fixes that; the sideloader still re-signs with your Apple ID.
        run: |
          APP=build/Build/Products/Release-iphoneos/Kite.app
          for f in "$APP"/Frameworks/*.framework; do
            codesign --force --sign - --timestamp=none "$f"
          done
          # The lock-screen widget, inside the app: signed before the app that holds it.
          for f in "$APP"/PlugIns/*.appex; do
            [ -e "$f" ] && codesign --force --sign - --timestamp=none "$f"
          done
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Package .ipa
        run: |
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/Kite.app Payload/Kite.app
          zip -qr -X Kite.ipa Payload
          unzip -l Kite.ipa | tail -n 3
          unzip -tq Kite.ipa
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Kite-ipa
          path: Kite.ipa
      - name: Release notes
        id: notes
        # The version from project.yml, and its "What's new" from CHANGELOG.md.
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## What's new in $VERSION"
            echo
            awk -v v="## $VERSION" '$0 ~ "^## " { if (on) exit; if (index($0, v) == 1) { on = 1; next } } on' CHANGELOG.md
            echo
            echo "---"
            echo "Unsigned app for sideloading. Download **Kite.ipa** below and install it with AltStore or Sideloadly. Kite Maps is an unofficial iPhone port of [Vela Maps](https://github.com/PimpinPumpkin/Vela). Every version is listed in [CHANGELOG.md](CHANGELOG.md)."
          } > notes.md
          cat notes.md
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.notes.outputs.version }}
          name: Kite Maps ${{ steps.notes.outputs.version }}
          body_path: notes.md
          files: Kite.ipa
      - name: Update the AltStore source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Writes apps.json to the altstore branch, the link people add in AltStore or SideStore.
        run: |
          APP=build/Build/Products/Release-iphoneos/Kite.app
          codesign -d --entitlements :- "$APP" > ents.plist 2>/dev/null || : > ents.plist
          mkdir -p source
          python3 .github/altstore/make_source.py "$APP" Kite.ipa ents.plist \
            v${{ steps.notes.outputs.version }} "${{ github.repository }}" source/apps.json
          cd source
          git init -q -b altstore
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apps.json && git commit -qm "AltStore source for build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" altstore

  duo:
    name: Screenshots (iPhone Duo)
    runs-on: xcode-27
    # Only a look at the foldable; never holds up the build.
    continue-on-error: true
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Set up Java (for the shared app's build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build the shared app (the same code as Android)
        run: .github/ios/shared-app.sh sim
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64 build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -40; tail -n 20 build.log; exit 1; }
          tail -n 3 build.log
      - name: Take screenshots, closed and open
        # The simulated Duo starts closed (the outer screen, display "primary"); DeviceHub opens it
        # (the inner screen, "primary-1"), then turns it upright.
        run: |
          DEV=$(xcrun simctl create Duo com.apple.CoreSimulator.SimDeviceType.iPhone-Duo com.apple.CoreSimulator.SimRuntime.iOS-27-1)
          xcrun simctl boot $DEV; xcrun simctl bootstatus $DEV -b > /dev/null
          xcrun simctl ui $DEV appearance dark
          xcrun simctl location $DEV set 50.9097,-1.4044
          xcrun simctl install $DEV simbuild/Build/Products/Debug-iphonesimulator/Kite.app
          xcrun simctl privacy $DEV grant location app.vela.ios || true
          mkdir -p shots
          shoot() { # name, display, steps...
            n=$1; disp=$2; shift 2
            for step in "$@"; do
              xcrun simctl launch --terminate-running-process --stderr="$PWD/shots/$n-$step.err.txt" $DEV app.vela.ios -demo $step > /dev/null
              case $step in browse) t=16;; place) t=28;; directions) t=38;; nav) t=44;; *) t=12;; esac
              sleep $t
              xcrun simctl io $DEV screenshot --display=$disp "shots/$n-$step.png" > /dev/null 2>&1 || echo "no shot $n-$step"
            done
          }
          shoot closed primary browse place nav
          bash .github/duo/pose.sh open
          shoot open primary-1 browse place directions nav settings saved
          bash .github/duo/pose.sh rotate
          shoot upright primary-1 browse place nav
          # Why Kite stopped, when it did: the crash reports and what it printed.
          cp ~/Library/Logs/DiagnosticReports/Kite* shots/ 2>/dev/null || true
          find shots -name '*.err.txt' -empty -delete
          ls shots
      - name: Save screenshots to the duo-screenshots branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          cd shots
          for f in *.png; do sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out "${f%.png}.jpg" >/dev/null; done
          rm -f *.png
          git init -q -b duo-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "iPhone Duo screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" duo-screenshots

  screens:
    name: Screenshots (simulator)
    # The shared app's map needs the iOS 26+ SDK (Xcode 16 can't link it).
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Set up Java (for the shared app's build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build the shared app (the same code as Android)
        run: .github/ios/shared-app.sh sim
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64 build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -40; tail -n 20 build.log; exit 1; }
          tail -n 5 build.log
      - name: Take screenshots
        run: |
          set -x
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ph=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')]; print(next((x['udid'] for x in ph if x['name'].endswith('Pro')), ph[0]['udid']))")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl location "$DEV" set 38.5449,-121.7405
          xcrun simctl install "$DEV" simbuild/Build/Products/Debug-iphonesimulator/Kite.app
          xcrun simctl privacy "$DEV" grant location app.vela.ios || true
          mkdir -p shots
          for step in browse search place directions nav cameras layers transit board mine stops rail welcome camalert streetview svtest svtest90 lookaround copy wazelink googlelink listscroll wazealert trafficalert wazedemo wazetap wazeroute wazesettings wazemap wazeintro searchfocus settings saved pickhome locationoff longname longdir addstop allalerts endtrip resume charges zones avoid faster browse3d browse2d mapsettings; do
            xcrun simctl launch --terminate-running-process --stderr="$PWD/shots/$step.err.txt" "$DEV" app.vela.ios -demo "$step"
            case $step in browse) t=16;; search) t=24;; place) t=28;; directions) t=38;; nav) t=44;; cameras) t=110;; layers) t=12;; transit) t=40;; board) t=24;; mine) t=14;; stops) t=40;; rail) t=30;; welcome) t=10;; camalert) t=52;; streetview) t=40;; svtest) t=12;; svtest90) t=12;; lookaround) t=40;; copy) t=34;; wazelink) t=16;; googlelink) t=24;; listscroll) t=30;; wazealert) t=44;; trafficalert) t=44;; wazedemo) t=16;; wazemap) t=55;; wazeintro) t=10;; wazetap) t=18;; wazeroute) t=40;; wazesettings) t=12;; searchfocus) t=14;; settings) t=10;; saved) t=10;; pickhome) t=12;; locationoff) t=14;; longname) t=20;; longdir) t=32;; addstop) t=34;; allalerts) t=48;; endtrip) t=44;; resume) t=12;; charges|zones) t=40;; avoid) t=40;; faster) t=48;; browse3d|browse2d) t=18;; mapsettings) t=10;; esac
            sleep $t
            xcrun simctl io "$DEV" screenshot "shots/$step.png"
          done
          xcrun simctl ui "$DEV" appearance light
          xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo place
          sleep 28
          xcrun simctl io "$DEV" screenshot shots/place-light.png
          for step in browse directions transit nav searchfocus faster browse3d; do
            xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo "$step"
            case $step in browse) t=16;; directions) t=38;; transit) t=40;; nav) t=44;; searchfocus) t=14;; faster) t=48;; browse3d) t=18;; esac
            sleep $t
            xcrun simctl io "$DEV" screenshot "shots/light-$step.png"
          done
          # Bigger text (the largest size short of the accessibility ones), back in dark mode.
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl ui "$DEV" content_size extra-extra-extra-large
          for step in browse place directions transit nav searchfocus settings allalerts longdir welcome wazeintro; do
            xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo "$step"
            case $step in browse) t=16;; place) t=28;; directions) t=38;; transit) t=40;; nav) t=44;; searchfocus) t=14;; settings) t=10;; allalerts) t=48;; longdir) t=32;; welcome) t=10;; wazeintro) t=10;; esac
            sleep $t
            xcrun simctl io "$DEV" screenshot "shots/big-$step.png"
          done
          xcrun simctl ui "$DEV" content_size large
          # Live camera photos (GitHub #15): London's cameras on the map, one opened, and the M3's before a drive.
          for step in livecams livecamcard; do
            xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo "$step"
            sleep 60
            xcrun simctl io "$DEV" screenshot "shots/$step.png"
          done
          xcrun simctl location "$DEV" set 50.9097,-1.4044
          for step in livecamroute livecamroutecard; do
            xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo "$step"
            sleep 60
            xcrun simctl io "$DEV" screenshot "shots/$step.png"
          done
          xcrun simctl location "$DEV" set 56.4120,-3.4700
          xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo uk
          sleep 50
          xcrun simctl io "$DEV" screenshot shots/uk.png
          xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo roundabout
          sleep 50
          xcrun simctl io "$DEV" screenshot shots/roundabout.png
          xcrun simctl ui "$DEV" appearance light
          xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo roundabout
          sleep 50
          xcrun simctl io "$DEV" screenshot shots/light-roundabout.png
          # 0.7.16 on the A9 out of Perth: the next speed limit, 2D and north up, and the zoom setting.
          for step in nextlimit flat northup closer wider; do
            xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo "$step"
            sleep 60
            xcrun simctl io "$DEV" screenshot "shots/light-$step.png"
          done
          xcrun simctl ui "$DEV" appearance dark
          for step in nextlimit northup; do
            xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo "$step"
            sleep 60
            xcrun simctl io "$DEV" screenshot "shots/$step.png"
          done
          # 0.7.17: the driving view with no route, by itself, with the road's name on the road.
          xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo cruise
          sleep 50
          xcrun simctl io "$DEV" screenshot shots/cruise.png
          xcrun simctl ui "$DEV" appearance light
          xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo cruise
          sleep 50
          xcrun simctl io "$DEV" screenshot shots/light-cruise.png
          xcrun simctl ui "$DEV" appearance dark
          # A long transit trip in England, from Reading into London, planned live by Transitous.
          xcrun simctl location "$DEV" set 51.4545,-0.9781
          xcrun simctl launch --terminate-running-process "$DEV" app.vela.ios -demo transituk
          sleep 40
          xcrun simctl io "$DEV" screenshot shots/transituk.png
          # The smallest iPhone still sold (SE, 667 pt tall): everything at once has to fit, and the
          # route's camera tiles. Never fails the build if this runner has no SE.
          SE=$(xcrun simctl create KiteSE com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation 2>/dev/null) || SE=""
          if [ -n "$SE" ]; then
            xcrun simctl shutdown "$DEV" || true
            xcrun simctl boot "$SE" && xcrun simctl bootstatus "$SE" -b
            xcrun simctl ui "$SE" appearance dark
            xcrun simctl install "$SE" simbuild/Build/Products/Debug-iphonesimulator/Kite.app
            xcrun simctl privacy "$SE" grant location app.vela.ios || true
            xcrun simctl location "$SE" set 38.5449,-121.7405
            xcrun simctl launch --terminate-running-process "$SE" app.vela.ios -demo allalerts
            sleep 48
            xcrun simctl io "$SE" screenshot shots/se-allalerts.png
            xcrun simctl location "$SE" set 50.9097,-1.4044
            xcrun simctl launch --terminate-running-process "$SE" app.vela.ios -demo livecamroute
            sleep 60
            xcrun simctl io "$SE" screenshot shots/se-livecamroute.png
            xcrun simctl location "$SE" set 56.4120,-3.4700
            xcrun simctl launch --terminate-running-process "$SE" app.vela.ios -demo roundabout
            sleep 50
            xcrun simctl io "$SE" screenshot shots/se-roundabout.png
          fi
      - name: Crash reports
        if: always()
        run: |
          cp ~/Library/Logs/DiagnosticReports/Kite* shots/ 2>/dev/null || true
          find shots -name '*.err.txt' -empty -delete || true
          ls shots | grep -v png || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Save screenshots to the ci-screenshots branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # Only a convenience for reviewing; never fails the build.
        continue-on-error: true
        run: |
          cd shots
          for f in *.png; do sips -s format jpeg -s formatOptions 70 -Z 1200 "$f" --out "${f%.png}.jpg" >/dev/null; done
          rm -f *.png
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
