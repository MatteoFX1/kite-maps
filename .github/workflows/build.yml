name: Build iPhone app

on:
  workflow_dispatch:

jobs:
  probe:
    name: Overnight audit
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: VelaCore
        run: swift test 2>&1 | grep -E "error:|Executed .* tests" | head -60
      - name: Roundabouts and limits
        working-directory: VelaCore
        run: swift run vela-probe roundabouts 2>&1 | grep -v "^\[" 
      - name: Roads without a limit
        run: python3 .github/probe/unknown_tags.py
