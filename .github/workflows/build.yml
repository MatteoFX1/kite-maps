name: Build iPhone app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Check search code
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: VelaCore
        run: swift test
      - name: Live Google search check
        working-directory: VelaCore
        continue-on-error: true
        run: swift run vela-probe "pizza" 40.7484 -73.9857

  ipa:
    name: Build Vela.ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Vela.xcodeproj \
            -scheme Vela \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Vela.app Payload/
          zip -qry Vela.ipa Payload
          ls -la Vela.ipa
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Vela-ipa
          path: Vela.ipa
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vela for iPhone (build ${{ github.run_number }})
          body: |
            Unsigned app for sideloading. Download **Vela.ipa** below and install it with AltStore or Sideloadly.
          files: Vela.ipa
