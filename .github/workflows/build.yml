name: Build iPhone app

on:
  workflow_dispatch:

jobs:
  probe:
    name: Overnight audit
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: VelaCore
        run: swift test 2>&1 | grep -E "error:|Executed .* tests" | head -60
      - name: Roundabouts and limits
        working-directory: VelaCore
        run: swift run vela-probe roundabouts 17 2>&1 | grep -v "^\[" 
      - name: Lanes mapped around the roundabouts
        run: python3 .github/probe/lanes.py 50.8930 -1.4490 50.9700 -1.3500
