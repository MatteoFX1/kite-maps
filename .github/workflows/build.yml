name: Build iPhone app

on:
  workflow_dispatch:

jobs:
  probe:
    name: Overnight audit
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: VelaCore
        run: swift test 2>&1 | grep -E "error:|Executed .* tests" | head -60
      - name: Roundabouts and limits
        working-directory: VelaCore
        run: |
          for n in 17 18 10 1 2; do swift run vela-probe roundabouts $n 2>&1 | grep -v "^\[" ; done
      - name: Lanes mapped around the roundabouts
        run: python3 .github/probe/lanes.py 50.8880 -1.4420 50.9620 -1.3640
