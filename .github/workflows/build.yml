name: Build iPhone app

on:
  workflow_dispatch:

jobs:
  probe:
    name: Overnight audit
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: VelaCore
        run: swift test 2>&1 | grep -E "error:|Executed .* tests" | head -60
      - name: Roundabouts and limits
        working-directory: VelaCore
        run: |
          for n in 17 19 10 6 7 1; do swift run vela-probe roundabouts $n 2>&1 | grep -v "^\[" ; done
