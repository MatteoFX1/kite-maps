name: Build iPhone app

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: VelaCore
        run: swift test 2>&1 | grep -E "error:|Executed .* tests" | head -60
      - name: Slip roads
        working-directory: VelaCore
        run: swift run vela-probe ramps 2>&1 | grep -v "^\[" | grep -v "^Building\|^Compiling\|^Build of"
