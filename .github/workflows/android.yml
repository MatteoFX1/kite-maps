name: Build Android app

on:
  push:
    paths:
      - 'android/**'
      - 'project.yml'
      - 'CHANGELOG.md'
      - '.github/workflows/android.yml'
      - '.github/fdroid/**'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/fdroid/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Kite.apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        # The same version number as the iPhone app (project.yml).
        working-directory: .
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Kite $VERSION"

      - name: Decode the signing key
        # One key for every release, so each new APK installs over the last. Without the secret
        # the APK is signed with a throwaway key (fine for a look, can't update an installed copy).
        env:
          KEYSTORE_B64: ${{ secrets.KITE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kite.jks"
            echo "KITE_KEYSTORE_PATH=$RUNNER_TEMP/kite.jks" >> "$GITHUB_ENV"
            echo "Signing with Kite's release key."
          else
            echo "No signing key secret: the APK gets a throwaway key."
          fi

      - name: Engine tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build the APK
        env:
          KITE_KEYSTORE_PASSWORD: ${{ secrets.KITE_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon -PappVersionName=${{ steps.version.outputs.version }} 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk ../Kite.apk
          ls -l ../Kite.apk

      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILED|What went wrong' -A2 "$RUNNER_TEMP/build.log" | head -150 || true

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Kite-apk
          path: Kite.apk

      - name: Add the APK to the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Kite Maps ${{ steps.version.outputs.version }}
          files: Kite.apk
