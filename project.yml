# XcodeGen spec: the build workflow turns this into Kite.xcodeproj (`xcodegen generate`).
name: Kite
options:
  bundleIdPrefix: app.vela
  deploymentTarget:
    iOS: "16.0"
targets:
  Kite:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
      - Shared
      # The shared app's fonts, pictures and the map's texts (made by .github/ios/shared-app.sh).
      - path: Frameworks/res/compose-resources
        type: folder
        buildPhase: resources
    dependencies:
      # The whole app (screens, map, driving), shared with Android: built from android/shared by
      # `./gradlew :shared:assembleKiteSharedReleaseXCFramework` and copied here (see build.yml).
      - framework: Frameworks/KiteShared.xcframework
        embed: true
      # The next turn on the lock screen and in the Dynamic Island.
      - target: KiteWidget
        embed: true
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kite
        CFBundleShortVersionString: "0.8.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Compose draws at the screen's full 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Kite shows where you are on the map, finds places near you and guides you turn by turn.
        NSLocationAlwaysAndWhenInUseUsageDescription: Kite keeps guiding you with the screen off during navigation.
        NSMicrophoneUsageDescription: Kite listens when you tap the microphone to search by voice.
        NSSpeechRecognitionUsageDescription: Kite turns what you say into a search.
        UIBackgroundModes:
          - location
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Kept from the Vela days so updates install over the old app and keep saved places.
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "1"
  KiteWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kite
        CFBundleShortVersionString: "0.8.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios.NavigationWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
